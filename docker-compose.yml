services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mess-kso
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: mess_kso
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: mess_kso
    ports:
      - "127.0.0.1:3100:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mess-kso-network

  postgres:
    image: postgres:16-alpine
    container_name: mess-kso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess_kso
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mess_kso
    volumes:
      - mess_kso_postgres_data:/var/lib/postgresql/data
    networks:
      - mess-kso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mess_kso -d mess_kso"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  mess-kso-network:
    driver: bridge

volumes:
  mess_kso_postgres_data:
